name: C++ migration tests
on:
  push:
    branches: [cpp-oops-migration]
    paths:
      - "research-paper-managment-main/research-paper-managment-main/cpp/**"
      - ".github/workflows/cpp-migration-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "research-paper-managment-main/research-paper-managment-main/cpp/**"
      - ".github/workflows/cpp-migration-tests.yml"
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-paper-managment-main/research-paper-managment-main/cpp
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev libssl-dev python3
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
